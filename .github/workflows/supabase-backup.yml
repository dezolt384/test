name: Backup notturno Supabase

on:
  schedule:
    # 03:17/04:17 in Italia: lontano dagli screenshot delle 09:00 e 21:00.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programmazione-collettiva-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Esporta, verifica e archivia
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: epmmfqukauuqgqegaezp
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: programmazione-collettiva
      BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installa Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Controlla configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_DB_URL
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Manca il secret ${name}"
              exit 1
            fi
          done
          command -v aws >/dev/null
          command -v jq >/dev/null
          command -v psql >/dev/null
          command -v supabase >/dev/null

      - name: Crea e verifica il backup
        id: create
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(./ops/backup/create-backup.sh "${RUNNER_TEMP}/programmazione-backup")"
          echo "archive_path=${archive_path}" >> "${GITHUB_OUTPUT}"

      - name: Carica su R2 e applica la conservazione
        shell: bash
        run: ./ops/backup/upload-r2.sh "${{ steps.create.outputs.archive_path }}"

      - name: Segnala esito positivo
        if: ${{ success() }}
        shell: bash
        run: |
          if [[ -n "${BACKUP_HEALTHCHECK_URL:-}" ]]; then
            curl --fail --silent --show-error --max-time 15 --retry 3 \
              "${BACKUP_HEALTHCHECK_URL}"
          fi

      - name: Segnala errore
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -n "${BACKUP_HEALTHCHECK_URL:-}" ]]; then
            curl --fail --silent --show-error --max-time 15 --retry 3 \
              "${BACKUP_HEALTHCHECK_URL}/fail" || true
          fi

